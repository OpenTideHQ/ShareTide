[status]
#production = [ "PRODUCTION", "DISABLED", "REMOVED" ]
#safe = [ "DESIGN" ]

[promotion]
#enabled = true
#promotion_target = "PRODUCTION"

[proxy]
# Empty values override CoreTide deployment defaults; ShareTide does not wire proxy secrets in CI.
proxy_user = ""
proxy_password = ""
proxy_host = ""
proxy_port = ""

# If enabled, updates a lookup continuously with MDR Data. Often useful to
# have access to MDR Data directly on external systems, e.g. for alert enriching
[metadata_lookup]
#enabled = false
#name = ""
#systems = ["splunk"]