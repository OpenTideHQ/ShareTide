  description: |
    The Shai-Hulud campaign includes a Docker privilege escalation technique
    that attempts to escape from container environments to gain root access
    on the host system by abusing privileged container capabilities.

    ## Attack Mechanism

    The malware executes the following Docker command to achieve container
    breakout and privilege escalation:

    ```bash
    docker run --rm --privileged -v /:/host ubuntu bash -c \
      "cp /host/tmp/runner /host/etc/sudoers.d/runner"
    ```

    ## Technical Breakdown

    1. **`docker run --rm`**: Creates a temporary container that is removed
       after execution

    2. **`--privileged`**: Grants the container full access to the host's
       devices and disables most security isolation. This is the key flag
       that enables the escape.

    3. **`-v /:/host`**: Mounts the entire host root filesystem into the
       container at `/host`, providing read/write access to all host files

    4. **`ubuntu`**: Uses a standard Ubuntu base image

    5. **`cp /host/tmp/runner /host/etc/sudoers.d/runner`**: Copies a
       malicious sudoers file from a staging location to the host's
       sudoers.d directory

    ## Privilege Escalation Result

    The copied sudoers file grants passwordless root access to the
    compromised user, effectively providing:
    - Full root privileges on the host system
    - Persistence beyond container lifecycle
    - Ability to modify any system configuration
    - Access to all data and credentials on the host

    ## Prerequisites

    For this attack to succeed, the following conditions must be met:
    - Docker must be installed and accessible to the compromised process
    - The user must have permissions to run Docker commands
    - The Docker daemon must allow privileged containers
    - A malicious sudoers file must be staged at `/tmp/runner`

    ## CI/CD Context

    This technique is particularly dangerous in CI/CD environments where:
    - Docker-in-Docker (DinD) configurations are common
    - Build agents often run Docker commands
    - Privileged mode may be enabled for building container images
    - Shared runners process code from multiple sources

    ## Detection Indicators

    - Docker commands with `--privileged` flag
    - Volume mounts of root filesystem (`-v /:/`)
    - Writes to `/etc/sudoers.d/` directory
    - Unexpected sudoers files appearing on systems
    - Docker run commands executed during npm install
