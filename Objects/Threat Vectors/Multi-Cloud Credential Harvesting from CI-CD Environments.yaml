  description: |
    The Shai-Hulud campaign includes sophisticated multi-cloud credential
    harvesting capabilities that target AWS, Azure, and Google Cloud Platform.
    The malware bundles official cloud SDKs to operate independently of any
    tools installed on the host system.

    ## Targeted Cloud Platforms

    The malware actively targets credentials for:
    - **AWS (Amazon Web Services)**
    - **Azure (Microsoft Cloud)**
    - **GCP (Google Cloud Platform)**

    ## Credential Sources

    ### Local Configuration Files
    The malware scrapes credentials from standard cloud configuration locations:
    - `~/.aws/credentials` (AWS credentials file)
    - `~/.aws/config` (AWS configuration)
    - `~/.azure/` directory (Azure CLI credentials)
    - Application Default Credentials for GCP

    ### Environment Variables
    Cloud credentials commonly stored in environment variables:
    - `AWS_ACCESS_KEY_ID`
    - `AWS_SECRET_ACCESS_KEY`
    - `AWS_SESSION_TOKEN`
    - `AZURE_CLIENT_ID`
    - `AZURE_CLIENT_SECRET`
    - `GOOGLE_APPLICATION_CREDENTIALS`

    ### Cloud Metadata Services (IMDS)
    The malware queries internal cloud metadata services to steal temporary
    session tokens from running instances:
    - AWS Instance Metadata Service (169.254.169.254)
    - Azure Instance Metadata Service
    - GCP Metadata Server

    ## Secret Exfiltration

    Using authenticated sessions obtained from harvested credentials, the
    malware dumps secrets from cloud secret management services:
    - **AWS Secrets Manager**
    - **Google Secret Manager**
    - **Azure Key Vault**

    ## Persistence and Escalation

    The malware attempts to:
    - **Assume privileged roles** using AWS STS (Security Token Service)
    - **Manipulate IAM policies** to maintain access or escalate privileges
    - Create long-term persistence in cloud environments

    ## Impact

    Successful credential harvesting enables attackers to:
    - Access cloud resources and data
    - Modify cloud infrastructure configurations
    - Exfiltrate additional sensitive data from cloud storage
    - Deploy additional malware or cryptominers
    - Incur significant cloud usage charges
    - Move laterally across cloud environments
