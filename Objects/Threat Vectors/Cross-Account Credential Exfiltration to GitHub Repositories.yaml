  description: |
    The Shai-Hulud campaign employs a sophisticated cross-victim exfiltration
    technique where stolen data from one victim is published to GitHub
    repositories owned by a second, unrelated victim. This technique
    complicates incident response and attribution.

    ## Attack Mechanism

    The malware exfiltrates stolen credentials and secrets by creating
    repositories on compromised GitHub accounts. The repository descriptions
    reference "Shai-Hulud" to identify them as part of the campaign.

    Key characteristics:
    - Cross-victim exfiltration: One victim's secrets appear in another
      victim's repositories
    - Automated repository creation: ~1,000 new repos created every 30 minutes
    - Massive scale: 25,000+ malicious repos across ~500 GitHub users

    ## Exfiltrated Data

    The campaign creates multiple JSON files containing stolen data:
    - **cloud.json**: Cloud provider credentials and configurations
    - **contents.json**: Sensitive file contents from compromised systems
    - **environment.json**: Environment variables from dev/CI environments
    - **truffleSecrets.json**: Secrets detected by credential scanning
    - **actionsSecrets.json**: GitHub Actions secrets

    ## Cross-Victim Implications

    Organizations may discover:
    - Their stolen data appearing in repositories they don't own
    - Other victims' data appearing in their own repositories
    - Difficulty identifying the full scope of their own compromise

    This cross-pollination of victim data creates significant challenges:
    1. Attribution becomes complex
    2. Multiple organizations must coordinate incident response
    3. Legal and compliance issues arise from hosting others' data
    4. Notification requirements may extend beyond the primary victim

    ## Campaign Scale

    - ~700 compromised npm packages (and growing)
    - 25,000+ malicious repositories
    - ~500 compromised GitHub users
    - 27% of scanned cloud environments potentially affected
    - Acceleration rate: ~1,000 new repos every 30 minutes

    ## Mitigation Status

    GitHub has begun mitigation efforts including:
    - Revoking compromised tokens
    - Privatizing malicious repositories
    - Issuing notifications to affected users
    - Reducing public malicious repos (down to ~300 as of November 26)

    However, many organizations remain exposed due to the broad cross-account
    spread of stolen credentials.
