  terrain: |
    RayInitiator is a persistent multi-stage bootkit that patches the GRUB
    bootloader on Cisco ASA 5500-X series devices without secure boot [1].
    The bootkit hijacks the boot process by modifying GRUB to execute
    malicious code when loading the Cisco ASA firmware. It specifically
    hooks the boot sequence where "Booting..." is output to the console.
