  terrain: |
    LINE VIPER is an x64 user-mode shellcode loader deployed to Cisco
    ASA devices via the RayInitiator bootkit [1]. The malware is loaded
    into memory from a WebVPN client authentication request containing
    a partial PKCS7 certificate followed by shellcode. It uses
    victim-specific tokens and per-victim RSA keys for securing tasking
    and exfiltration.
