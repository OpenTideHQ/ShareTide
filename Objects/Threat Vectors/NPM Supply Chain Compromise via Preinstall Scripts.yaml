  description: |
    The Shai-Hulud npm supply-chain campaign compromises legitimate popular NPM
    packages by publishing trojanized versions through compromised maintainer
    accounts. Unlike previous variants, this campaign executes malicious code
    during the preinstall lifecycle phase of npm package installation.

    ## Attack Mechanism

    The malware is distributed through compromised npm packages from major
    organizations including Zapier, ENS Domains, PostHog, and Postman. These
    packages are highly prevalent, occurring in approximately 27% of cloud
    and code environments. The number of compromised packages is steadily
    growing, currently at ~700 total.

    ## Execution Method

    The attack uses npm install lifecycle scripts, specifically the preinstall
    phase. Two new payload files are characteristic of this variant:
    - setup_bun.js
    - bun_environment.js

    The malware creates exfiltration files:
    - cloud.json (cloud credentials)
    - contents.json (file contents)
    - environment.json (environment variables)
    - truffleSecrets.json (detected secrets)

    ## CI Environment Behavior

    The malware behaves differently based on the execution environment:
    - In CI Environments: Executes synchronously, ensuring the runner remains
      active for the entire infection process
    - In Non-CI Environments: Executes as a background process to avoid
      alerting users during package installation

    ## Exfiltration

    Stolen data is exfiltrated cross-victim to GitHub repositories with
    descriptions referencing Shai-Hulud. This means victim data may be
    published to repositories owned by other unaffiliated compromised users.
    The blast radius is massive with 25,000+ malicious repos across ~500
    GitHub users, accelerating at ~1,000 new repos every 30 minutes.

    ## Multi-Platform Support

    The malware supports Linux, Windows, and macOS based runners with
    suitable payloads for each operating system.
