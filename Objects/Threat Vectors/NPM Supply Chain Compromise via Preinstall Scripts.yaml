  terrain: |
    Developer machines or CI/CD pipelines using npm to install dependencies.
    The malware executes during the preinstall lifecycle phase, meaning that
    any environment running `npm install` with a compromised package is at risk.
    The attack widens the blast radius across dev machines and CI/CD pipelines
