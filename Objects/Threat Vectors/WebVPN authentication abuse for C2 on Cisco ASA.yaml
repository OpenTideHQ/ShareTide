  terrain: |
    LINE VIPER malware deployed on Cisco ASA devices leverages WebVPN
    client authentication sessions over HTTPS as a command and control
    channel [1]. The malware is loaded into memory from WebVPN client
    authentication requests containing partial PKCS7 certificates
    followed by shellcode. Tasking and exfiltration are secured using
    per-victim RSA keys and per-request AES encryption.
